# Triggered by tags matching "TypeNative_{version}" (e.g. TypeNative_0.0.18)
# Runs tests, creates a GitHub release, and publishes to npm.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup on npmjs.com:
#   typenative package page → Settings → Publishing access → Trusted Publisher → Connect GitHub
#     - Organization or user: danisss9
#     - Repository:           typenative
#     - Workflow filename:    npm-publish-github-packages.yml
#     - Environment name:     (leave blank)
# Requires npm >= 11.5.1 (ensured below) and the `id-token: write` permission.

name: Release & Publish

on:
  push:
    tags:
      - 'TypeNative_*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: npm ci
      - run: npm ci
        working-directory: test
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#TypeNative_}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TypeNative v${{ steps.version.outputs.VERSION }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Trusted Publishing (OIDC) requires npm >= 11.5.1 — ensure we have it
      - run: npm install -g npm@latest

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#TypeNative_}" >> $GITHUB_OUTPUT

      - name: Sync package.json version to tag
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - run: npm ci

      # Authenticates via OIDC (id-token: write) — no NODE_AUTH_TOKEN needed.
      # Provenance is included automatically; the flag is kept for explicitness.
      - run: npm publish --provenance --access public
