name: CI

on:
  push:
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - run: npm ci

      - run: npm run build

      - run: npm ci
        working-directory: conformance

      - run: npm run conformance
